<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEJV DOWNLOAD - Descarga lo que te gusta</title>

    <meta property="og:image" content="https://dl.mejv.pro/preview.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://dl.mejv.pro/">
    <meta name="twitter:title" content="MEJV Download - Descarga tu música y videos">
    <meta name="twitter:description" content="Descarga videos y música de YouTube y Spotify de forma rápida y sin publicidad.">
    <meta name="twitter:image" content="https://dl.mejv.pro/preview.jpg">
    
    <link rel="icon" type="image/png" href="https://mejv.pro//assets/images/icon.png">
    <link rel="apple-touch-icon" href="https://mejv.pro//assets/images/icon.png">

    <meta name="language" content="Spanish">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #070b14;
        }
        .bg-glow-top-left { background: radial-gradient(circle at 0% 10%, rgba(0, 162, 255, 0.15) 0%, rgba(7, 11, 20, 0) 50%); }
        .bg-glow-center { background: radial-gradient(circle at 50% 30%, rgba(204, 255, 0, 0.1) 0%, rgba(7, 11, 20, 0) 60%); }
        .bg-glow-bottom-right { background: radial-gradient(circle at 100% 100%, rgba(0, 85, 255, 0.15) 0%, rgba(7, 11, 20, 0) 60%); }
        .glass-input { background: rgba(13, 20, 36, 0.7); border: 1px solid rgba(0, 162, 255, 0.3); backdrop-filter: blur(12px); }
        .glass-input:focus-within { border-color: rgba(204, 255, 0, 0.8); box-shadow: 0 0 20px rgba(204, 255, 0, 0.2); }
        .btn-gradient { background: linear-gradient(135deg, #0066ff 0%, #aaff00 100%); box-shadow: 0 4px 20px rgba(0, 102, 255, 0.4); color: #000; }
        .btn-gradient:hover { background: linear-gradient(135deg, #1a75ff 0%, #bbff33 100%); box-shadow: 0 6px 25px rgba(170, 255, 0, 0.5); }
        .wave-bg { position: absolute; bottom: 0; left: 0; width: 100%; overflow: hidden; line-height: 0; pointer-events: none; }
        .wave-bg svg { position: relative; display: block; width: calc(150% + 1.3px); height: 180px; }
        .logo-glow { filter: drop-shadow(0px 0px 30px rgba(170, 255, 0, 0.3)) drop-shadow(0px 0px 15px rgba(0, 102, 255, 0.4)); }
    </style>
</head>
<body class="text-white min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-[#aaff00] selection:text-black">

    <div class="fixed inset-0 bg-glow-top-left pointer-events-none"></div>
    <div class="fixed inset-0 bg-glow-center pointer-events-none"></div>
    <div class="fixed inset-0 bg-glow-bottom-right pointer-events-none"></div>

    <div class="max-w-md w-full mx-auto px-6 py-6 flex-1 flex flex-col justify-between relative z-10">

        <main class="my-auto py-8 flex flex-col items-center w-full">

            <div class="relative mb-6 mt-2 flex items-center justify-center">
                <div class="absolute inset-0 bg-gradient-to-tr from-blue-600/30 to-[#aaff00]/30 blur-3xl rounded-full scale-125"></div>
                <img src="./logo.png" alt="MEJV Download Logo" class="w-48 sm:w-60 object-contain relative z-10 logo-glow transition-transform duration-500 hover:scale-105">
            </div>

            <div class="w-full space-y-4">
                <div class="glass-input rounded-full px-5 py-3.5 flex items-center space-x-3 transition-all duration-300">
                    <i data-lucide="link" class="w-5 h-5 text-slate-400 flex-shrink-0" id="input-icon"></i>
                    <input type="url" id="video-url" placeholder="Pega aquí el enlace..." class="w-full bg-transparent text-white placeholder-slate-400 text-sm focus:outline-none font-normal" autocomplete="off">
                    <button id="paste-btn" class="text-xs font-bold text-[#aaff00] hover:text-white bg-[#aaff00]/10 hover:bg-[#aaff00]/20 px-3 py-1.5 rounded-full transition-colors flex items-center space-x-1">
                        <i data-lucide="clipboard" class="w-3.5 h-3.5"></i>
                        <span>Pegar</span>
                    </button>
                </div>

                <div id="options-panel" class="hidden transition-all duration-500 ease-out space-y-3 p-4 bg-[#0d1424]/90 rounded-2xl border border-blue-500/30 backdrop-blur-md">
                    <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
                        <span class="text-xs font-medium text-slate-400">Plataforma detectada:</span>
                        <div id="platform-badge" class="flex items-center space-x-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-blue-500/20 text-blue-300">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-2">Selecciona el formato:</label>
                        <div id="format-container" class="grid grid-cols-2 gap-3">
                        </div>
                    </div>

                    <div id="quality-container" class="hidden pt-2 border-t border-slate-800/60 mt-2">
                        <label class="block text-xs font-semibold text-slate-300 mb-2">Calidad del vídeo:</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button type="button" data-quality="360p" class="quality-opt-btn py-2 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-300 text-xs font-medium hover:border-[#aaff00] transition-all">360p</button>
                            <button type="button" data-quality="480p" class="quality-opt-btn py-2 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-300 text-xs font-medium hover:border-[#aaff00] transition-all">480p</button>
                            <button type="button" data-quality="1080p" class="quality-opt-btn py-2 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-300 text-xs font-medium hover:border-[#aaff00] transition-all">1080p</button>
                        </div>
                    </div>
                </div>

                <button id="download-btn" class="hidden w-full btn-gradient py-4 rounded-full flex items-center justify-center space-x-2.5 font-extrabold text-base tracking-wide transition-all transform active:scale-98">
                    <i data-lucide="download" class="w-5 h-5 stroke-[2.5]"></i>
                    <span id="download-btn-text">Descargar</span>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-6 w-full mt-10 max-w-[200px]">
                <div class="flex flex-col items-center space-y-2 group cursor-pointer">
                    <div class="w-16 h-16 rounded-full bg-[#0d1424]/80 border border-blue-500/20 flex items-center justify-center group-hover:border-red-500/50 group-hover:bg-red-500/10 transition-all duration-300 shadow-lg">
                        <i class="fa-brands fa-youtube text-2xl text-red-500"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300 group-hover:text-white transition-colors">YouTube</span>
                </div>
                <div class="flex flex-col items-center space-y-2 group cursor-pointer">
                    <div class="w-16 h-16 rounded-full bg-[#0d1424]/80 border border-blue-500/20 flex items-center justify-center group-hover:border-green-500/50 group-hover:bg-green-500/10 transition-all duration-300 shadow-lg">
                        <i class="fa-brands fa-spotify text-2xl text-green-500"></i>
                    </div>
                    <span class="text-xs font-medium text-slate-300 group-hover:text-white transition-colors">Spotify</span>
                </div>
            </div>

            <div class="w-full border-t border-slate-800/60 my-10"></div>
            <div class="w-full">
                <div class="grid grid-cols-3 gap-2 relative">
                    <div class="flex flex-col items-center text-center space-y-2 relative z-10">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-[#aaff00] flex items-center justify-center text-black font-extrabold text-sm shadow-md shadow-blue-900/50">1</div>
                        <i data-lucide="link" class="w-6 h-6 text-[#aaff00] mt-1"></i>
                        <div><h4 class="text-xs font-bold text-white leading-tight">Copia el link</h4><p class="text-[10px] text-slate-400 mt-0.5 leading-tight">de tu plataforma</p></div>
                    </div>
                    <div class="absolute left-[27%] top-3.5 z-0 text-blue-400/50"><i data-lucide="arrow-right" class="w-5 h-5"></i></div>
                    <div class="flex flex-col items-center text-center space-y-2 relative z-10">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-[#aaff00] flex items-center justify-center text-black font-extrabold text-sm shadow-md shadow-blue-900/50">2</div>
                        <i data-lucide="copy" class="w-6 h-6 text-[#aaff00] mt-1"></i>
                        <div><h4 class="text-xs font-bold text-white leading-tight">Pégalo</h4><p class="text-[10px] text-slate-400 mt-0.5 leading-tight">en el input</p></div>
                    </div>
                    <div class="absolute right-[27%] top-3.5 z-0 text-blue-400/50"><i data-lucide="arrow-right" class="w-5 h-5"></i></div>
                    <div class="flex flex-col items-center text-center space-y-2 relative z-10">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-[#aaff00] flex items-center justify-center text-black font-extrabold text-sm shadow-md shadow-blue-900/50">3</div>
                        <i data-lucide="download" class="w-6 h-6 text-[#aaff00] mt-1"></i>
                        <div><h4 class="text-xs font-bold text-white leading-tight">Descargar</h4><p class="text-[10px] text-slate-400 mt-0.5 leading-tight">y listo</p></div>
                    </div>
                </div>
            </div>

        </main>

        <footer class="text-center py-2 text-[11px] text-slate-500 relative z-10">
            &copy; 2026 MEJV. Todos los derechos reservados.
        </footer>
    </div>

    <div class="wave-bg">
        <svg viewBox="0 0 500 150" preserveAspectRatio="none">
            <path d="M-5.92,82.39 C188.77,163.32 322.51,-12.33 509.31,61.67 L500.00,150.00 L0.00,150.00 Z" style="stroke: none; fill: rgba(0, 102, 255, 0.15);"></path>
            <path d="M-8.18,48.85 C142.49,137.66 351.29,19.24 504.22,90.29 L500.00,150.00 L0.00,150.00 Z" style="stroke: none; fill: rgba(170, 255, 0, 0.1);"></path>
        </svg>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-[#0d1424] text-white px-5 py-3 rounded-full shadow-2xl border border-blue-500/30 text-xs font-medium opacity-0 pointer-events-none transition-all duration-300 z-50 flex items-center space-x-2">
        <i data-lucide="info" class="w-4 h-4 text-[#aaff00]" id="toast-icon"></i>
        <span id="toast-message">Notificación</span>
    </div>

    <script>
        lucide.createIcons();

        const videoUrlInput = document.getElementById('video-url');
        const pasteBtn = document.getElementById('paste-btn');
        const optionsPanel = document.getElementById('options-panel');
        const platformBadge = document.getElementById('platform-badge');
        const formatContainer = document.getElementById('format-container');
        const qualityContainer = document.getElementById('quality-container');
        const downloadBtn = document.getElementById('download-btn');
        const downloadBtnText = document.getElementById('download-btn-text');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');
        const toastIcon = document.getElementById('toast-icon');

        let currentPlatform = null; 
        let selectedFormat = null; 
        let selectedQuality = '360p';
        let currentUrl = "";

        function showToast(message, isError = false) {
            toastMessage.textContent = message;
            if (isError) {
                toast.classList.add('border-red-500/50');
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.classList.replace('text-[#aaff00]', 'text-red-400');
            } else {
                toast.classList.remove('border-red-500/50');
                toastIcon.setAttribute('data-lucide', 'info');
                toastIcon.classList.replace('text-red-400', 'text-[#aaff00]');
            }
            lucide.createIcons();
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3500);
        }

        function detectPlatform(url) {
            const cleanUrl = url.trim().toLowerCase();
            if (!cleanUrl) return null;
            if (cleanUrl.includes('youtube.com') || cleanUrl.includes('youtu.be')) return 'youtube';
            if (cleanUrl.includes('spotify.com')) return 'spotify';
            return null;
        }

        function renderFormatOptions(platform) {
            currentPlatform = platform;
            selectedFormat = null;
            downloadBtn.classList.add('hidden');
            qualityContainer.classList.add('hidden');

            if (platform === 'youtube') {
                platformBadge.className = "flex items-center space-x-1.5 text-xs font-bold px-3 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30";
                platformBadge.innerHTML = `<i class="fa-brands fa-youtube text-sm"></i> <span>YouTube</span>`;
            } else if (platform === 'spotify') {
                platformBadge.className = "flex items-center space-x-1.5 text-xs font-bold px-3 py-1 rounded-full bg-green-500/20 text-green-400 border border-green-500/30";
                platformBadge.innerHTML = `<i class="fa-brands fa-spotify text-sm"></i> <span>Spotify</span>`;
            }

            formatContainer.innerHTML = '';

            if (platform === 'youtube') {
                formatContainer.className = "grid grid-cols-2 gap-3";
                
                const audioBtn = document.createElement('button');
                audioBtn.type = 'button';
                audioBtn.className = "format-opt-btn flex items-center justify-center space-x-2 py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-300 font-medium text-xs hover:border-[#aaff00] hover:text-white transition-all";
                audioBtn.innerHTML = `<i data-lucide="music" class="w-4 h-4 text-blue-400"></i><span>Audio</span>`;
                audioBtn.onclick = () => selectFormat('audio', audioBtn);

                const videoBtn = document.createElement('button');
                videoBtn.type = 'button';
                videoBtn.className = "format-opt-btn flex items-center justify-center space-x-2 py-2.5 px-4 rounded-xl border border-slate-700 bg-slate-800/80 text-slate-300 font-medium text-xs hover:border-[#aaff00] hover:text-white transition-all";
                videoBtn.innerHTML = `<i data-lucide="video" class="w-4 h-4 text-[#aaff00]"></i><span>Vídeo</span>`;
                videoBtn.onclick = () => selectFormat('video', videoBtn);

                formatContainer.appendChild(audioBtn);
                formatContainer.appendChild(videoBtn);
            } else if (platform === 'spotify') {
                formatContainer.className = "grid grid-cols-1 gap-3";
                const audioBtn = document.createElement('button');
                audioBtn.type = 'button';
                audioBtn.className = "format-opt-btn flex items-center justify-center space-x-2 py-2.5 px-4 rounded-xl border border-blue-500/80 bg-blue-600/20 text-white font-medium text-xs transition-all shadow-sm shadow-blue-500/30";
                audioBtn.innerHTML = `<i data-lucide="music" class="w-4 h-4 text-blue-400"></i><span>Audio</span>`;
                formatContainer.appendChild(audioBtn);
                selectFormat('audio', audioBtn);
            }

            optionsPanel.classList.remove('hidden');
            lucide.createIcons();
        }

        function selectFormat(format, clickedBtn) {
            selectedFormat = format;
            const allOptBtns = formatContainer.querySelectorAll('.format-opt-btn');
            allOptBtns.forEach(btn => {
                btn.classList.remove('border-[#aaff00]', 'bg-[#aaff00]/10', 'text-white', 'shadow-md', 'shadow-[#aaff00]/20');
                btn.classList.add('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
            });
            if (clickedBtn) {
                clickedBtn.classList.remove('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
                clickedBtn.classList.add('border-[#aaff00]', 'bg-[#aaff00]/10', 'text-white', 'shadow-md', 'shadow-[#aaff00]/20');
            }

            if (currentPlatform === 'youtube' && format === 'video') {
                qualityContainer.classList.remove('hidden');
                selectedQuality = '360p';
                updateQualityUI();
            } else {
                qualityContainer.classList.add('hidden');
            }

            downloadBtnText.textContent = `Descargar ${format === 'audio' ? 'Audio' : 'Vídeo'}`;
            downloadBtn.classList.remove('hidden');
        }

        const qualityBtns = document.querySelectorAll('.quality-opt-btn');
        
        function updateQualityUI() {
            qualityBtns.forEach(btn => {
                if (btn.getAttribute('data-quality') === selectedQuality) {
                    btn.classList.remove('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
                    btn.classList.add('border-[#aaff00]', 'bg-[#aaff00]/10', 'text-[#aaff00]');
                } else {
                    btn.classList.remove('border-[#aaff00]', 'bg-[#aaff00]/10', 'text-[#aaff00]');
                    btn.classList.add('border-slate-700', 'bg-slate-800/80', 'text-slate-300');
                }
            });
        }

        qualityBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                selectedQuality = btn.getAttribute('data-quality');
                updateQualityUI();
            });
        });

        videoUrlInput.addEventListener('input', (e) => {
            const url = e.target.value;
            currentUrl = url;
            const platform = detectPlatform(url);
            if (platform) {
                renderFormatOptions(platform);
            } else {
                optionsPanel.classList.add('hidden');
                downloadBtn.classList.add('hidden');
            }
        });

        if (pasteBtn) {
            pasteBtn.addEventListener('click', async () => {
                try {
                    const text = await navigator.clipboard.readText();
                    videoUrlInput.value = text;
                    videoUrlInput.dispatchEvent(new Event('input'));
                    showToast('¡Enlace pegado!');
                } catch (err) {
                    showToast('Por favor, pega el enlace manualmente.', true);
                }
            });
        }

        downloadBtn.addEventListener('click', async () => {
            if (!selectedFormat || !currentPlatform || !currentUrl) return;

            const originalHtml = downloadBtn.innerHTML;
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-80', 'cursor-not-allowed');
            downloadBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Conectando...</span>
            `;
            
            const BACKEND_URL = 'https://dl.mejv.pro';
            
            try {
                let fetchUrl = `${BACKEND_URL}/api/resolve?url=${encodeURIComponent(currentUrl)}&type=${selectedFormat}&platform=${currentPlatform}`;
                
                if (currentPlatform === 'youtube' && selectedFormat === 'video') {
                    fetchUrl += `&quality=${selectedQuality}`;
                }

                const response = await fetch(fetchUrl);
                const data = await response.json();

                if (!response.ok || !data.status) {
                    throw new Error(data.error || 'Error al procesar el enlace.');
                }

                showToast(`¡Descarga iniciada!`, false);
                window.location.href = data.data.url;

            } catch (error) {
                showToast(error.message, true);
            } finally {
                setTimeout(() => {
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    downloadBtn.innerHTML = originalHtml;
                    lucide.createIcons();
                }, 1500);
            }
        });
    </script>
</body>
</html>
